services:
  app:
    build: .
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL to be fully ready...' &&
        until echo 'SELECT 1;' | npx prisma db execute --stdin > /dev/null 2>&1; do
          sleep 1
        done &&
        echo 'PostgreSQL is ready! Running migrations...' &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        npm run dev
      "
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wuphf?connect_timeout=30&pool_timeout=30 
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=943dre37af46f4ae5aa5ed079d45d030
      - GOOGLE_CLIENT_ID=578044382936-9e25sn8rl63jn2hj20p3te6u4s0qvium.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
    networks:
      - wuphf-net

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wuphf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 1. Define how Docker checks if Postgres is ready to accept connections
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wuphf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wuphf-net

networks:
  wuphf-net:
    driver: bridge
    enable_ipv6: false
volumes:
  postgres-data: