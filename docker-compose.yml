services:
  app:
    build:
      context: .
      target: dev
    command: >
      sh -c "
        echo 'Running DB migrations...' &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        npm run dev
      "
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - wuphf-net

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wuphf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wuphf"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wuphf-net

networks:
  wuphf-net:
    driver: bridge

volumes:
  postgres-data:
